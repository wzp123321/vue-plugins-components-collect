<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>地球大屏 · 城市飞线 Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "PingFang SC", sans-serif; }
  #app { position: fixed; inset: 0; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #6cf; font-size: 18px; letter-spacing: 2px; background: #000; z-index: 10;
    transition: opacity .8s ease;
  }
  #tip { position: fixed; left: 16px; bottom: 14px; color: #5ad; font-size: 12px; opacity: .6; }
</style>
<!-- 用 importmap 引入 three 与官方扩展（postprocessing / controls / loaders） -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">地球加载中…</div>
<div id="tip">鼠标拖拽旋转 · 滚轮缩放</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'; // 预留：如要加载 glb 模型
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const EARTH_RADIUS = 1;
const container = document.getElementById('app');

// ---------- 基础三件套 ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1.2, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 电影感色调
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 1.5;
controls.maxDistance = 8;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// ---------- 光照 ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(5, 3, 5);
scene.add(sun);

// ---------- 星空背景 ----------
(function addStars() {
  const count = 3500;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 40 + Math.random() * 60;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi);
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, sizeAttenuation: true })));
})();

// ---------- 经纬转 3D 坐标 ----------
function latLongToVector3(lat, lon, radius) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
     radius * Math.cos(phi),
     radius * Math.sin(phi) * Math.sin(theta)
  );
}

// ---------- 地球（白天贴图 + 夜景灯光自发光） ----------
const earthGroup = new THREE.Group();
scene.add(earthGroup);

const loader = new THREE.TextureLoader();
const manager = new THREE.LoadingManager();
manager.onLoad = () => {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 800);
};
const dayMap   = loader.load('https://unpkg.com/three@0.160.0/examples/textures/planets/earth_atmos_2048.jpg', undefined, undefined, undefined);
const nightMap = loader.load('https://unpkg.com/three@0.160.0/examples/textures/planets/earth_lights_2048.png', undefined, undefined, undefined);

const earthMat = new THREE.MeshStandardMaterial({
  map: dayMap,
  emissive: 0xffffff,
  emissiveMap: nightMap,       // 夜景城市灯光 → 被 Bloom 点亮，超有科技感
  emissiveIntensity: 1.6,
  roughness: 1, metalness: 0
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS, 64, 64), earthMat);
earthGroup.add(earth);

// ---------- 大气辉光（Fresnel，背面 + 叠加混合） ----------
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS * 1.18, 64, 64),
  new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vNormal;
      void main() {
        float intensity = pow(0.62 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
        gl_FragColor = vec4(0.25, 0.55, 1.0, 1.0) * intensity;
      }`,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true
  })
);
scene.add(atmosphere);

// ---------- 城市与飞线数据 ----------
const cities = {
  Beijing:   [39.9, 116.4],
  Shanghai:  [31.2, 121.5],
  NewYork:   [40.7, -74.0],
  London:    [51.5, -0.12],
  Sydney:    [-33.9, 151.2],
  SaoPaulo:  [-23.5, -46.6],
  Moscow:    [55.7, 37.6],
  Dubai:     [25.2, 55.3]
};
// 路由：[起点, 终点, 颜色]
const routes = [
  ['Beijing', 'London', 0x36e0ff],
  ['Beijing', 'NewYork', 0x36e0ff],
  ['Shanghai', 'Sydney', 0x7afcff],
  ['London', 'NewYork', 0xffd166],
  ['NewYork', 'SaoPaulo', 0xffd166],
  ['Moscow', 'Dubai', 0xff6b9d],
  ['Dubai', 'Shanghai', 0xff6b9d]
];

// 城市光点
const cityGroup = new THREE.Group();
earthGroup.add(cityGroup);
for (const [name, [lat, lon]] of Object.entries(cities)) {
  const p = latLongToVector3(lat, lon, EARTH_RADIUS * 1.005);
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.012, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0x66f0ff })
  );
  dot.position.copy(p);
  cityGroup.add(dot);
}

// 生成一条飞线（曲线 + 流动光段 + 亮头）
function createFlyLine(a, b, color) {
  const start = latLongToVector3(a[0], a[1], EARTH_RADIUS);
  const end   = latLongToVector3(b[0], b[1], EARTH_RADIUS);
  const mid = start.clone().add(end).multiplyScalar(0.5);
  const dist = start.distanceTo(end);
  mid.normalize().multiplyScalar(EARTH_RADIUS + dist * 0.5); // 弧高随距离增大
  const curve = new THREE.QuadraticBezierCurve3(start, mid, end);

  const pts = curve.getPoints(120);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  geo.setDrawRange(0, 0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.5 }));

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.014, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  earthGroup.add(line, head);
  return { line, head, pts, progress: Math.random(), speed: 0.0025 + Math.random() * 0.002, trail: 16 };
}

const flyLines = routes.map(([f, t, c]) =>
  createFlyLine(cities[f], cities[t], c)
);

// ---------- 后期：Bloom 辉光 ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.5, 0.6);
composer.addPass(bloom);

// ---------- 动画循环 ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  earthGroup.rotation.y += 0.0006; // 地球自转
  atmosphere.position.copy(earthGroup.position);

  for (const f of flyLines) {
    f.progress += f.speed;
    if (f.progress > 1) f.progress = 0;
    const headIdx = Math.floor(f.progress * (f.pts.length - 1));
    const start = Math.max(0, headIdx - f.trail);
    f.line.geometry.setDrawRange(start, headIdx - start + 1); // 流动光段
    f.head.position.copy(f.pts[headIdx]);                    // 亮头
  }
  controls.update();
  composer.render();
}
animate();

// ---------- 自适应 ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

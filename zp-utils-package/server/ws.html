<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<button id="buttonEl">发送</button>
	</body>
	<script>
		let scoket;
		let scoketUrl = "";
		let isConcent = false; //连接状态
		let globalCallback = (e) => {};
		//scoket 初始化连接
		const webScoketInit = (url) => {
			return new Promise((reslove) => {
				try {
					scoketUrl = url;
					scoket = new WebSocket(url);
					if (typeof WebSocket == undefined) {
						alert("您的浏览器不支持socket！使用谷歌浏览器！");
					} else {
						scoket.onopen = () => {
							console.log("客户端scoket连接成功");
							isConcent = true;
							heartCheck.start();
							reslove();
						};
						scoket.onmessage = onMessage;
						scoket.onerror = onError;
						scoket.onclose = onClose;
					}
				} catch {
					throw "scoket连接错误";
				}
			});
		};

		//scoket 消息监听
		function onMessage(msg) {
			//收到服务端心跳检测返回消息 重置心跳
			if (msg.data == "HeartBeat") {
				console.log("收到服务端心跳检测");
				heartCheck.reset();
			} else {
				//如果不是心跳检测回应则触发消息回调
				globalCallback(msg.data);
			}
		}

		//监听socket错误信息
		function onError(err) {
			isConcent = false;
			console.log("err", err);
		}

		//监听socket关闭
		function onClose() {
			isConcent = false;
			scoket.close();
			const { url } = scoket;
			console.log("执行重连", url);
			webScoketInit(url);
		}

		/**
		 * 消息监听方法
		 * @param {Function} callback  回调函数
		 * @return {}
		 */

		function messageListener(callback) {
			if (typeof callback == "function") {
				globalCallback = callback;
			}
		}

		/**
		 *  向服务端发送消息的方法
		 * @param {String} message 发送的内容（必须是字符串）
		 * @return {}
		 */
		function messageSend(message) {
			const { readyState, OPEN, CLOSED, CLOSING, CONNECTING } = scoket;
			console.log(scoket);
			switch (readyState) {
				case CONNECTING:
					break;
				case OPEN:
					scoket.send(message);
					break;
				case CLOSING:
					break;
				case CLOSED:
					break;
				default:
					break;
			}
		}

		/*
		  scoket 心跳检测机制方法
		  每间隔 30s 向服务端发起一个询问 HeartBeat 如果服务端返回消息表示连接正常则重置心跳
		  如果scoket 抛错则需要进行scoket重连
		*/
		const heartCheck = {
			timeout: 30000,
			timeoutObj: null,
			reset: function () {
				clearTimeout(this.timeoutObj);
				this.start();
			},
			start: function () {
				this.timeoutObj = setTimeout(function () {
					console.log("发送心跳检测");
					if (isConcent) {
						scoket.send("HeartBeat");
					} else {
						clearTimeout(this.timeoutObj);
					}
				}, this.timeout);
			},
		};

		webScoketInit("ws://192.168.101.161:8080");
		console.dir(buttonEl);
		buttonEl.onclick = () => {
			messageSend("rwerew");
		};
	</script>
</html>
